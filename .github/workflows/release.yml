name: Release

# 触发条件: 推送 v 开头的 tag (例如 v0.3.3, v1.0.0)
on:
  push:
    tags:
      - 'v*'

# 防止重复 release 跑挂
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # 创建 release 需要写权限

jobs:
  # ─────────────────────────────────────────────────
  # 1. 构建矩阵: 三个平台并行构建
  # ─────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false  # 一个平台失败不影响其他平台
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-14
            label: macos-arm64
            binary_name: apple-books-exporter-aarch64-apple-darwin
          # macOS Intel
          - target: x86_64-apple-darwin
            os: macos-13
            label: macos-x86_64
            binary_name: apple-books-exporter-x86_64-apple-darwin
          # Linux x86_64 已移除 - Apple Books 仅存在于 macOS,无需 Linux 二进制

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Locate binary
        id: locate
        run: |
          BINARY="target/${{ matrix.target }}/release/apple-books-exporter"
          if [ ! -f "$BINARY" ]; then
            echo "❌ Binary not found: $BINARY"
            ls -la target/${{ matrix.target }}/release/ 2>/dev/null || true
            exit 1
          fi
          echo "binary_path=$BINARY" >> "$GITHUB_OUTPUT"
          echo "✅ Built: $BINARY ($(du -h "$BINARY" | cut -f1))"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ steps.locate.outputs.binary_path }}
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────
  # 2. 收集所有 artifact, 创建/更新 GitHub Release
  # ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh dist/

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          sha256sum apple-books-exporter-* > SHA256SUMS
          cat SHA256SUMS

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          # 用 tag 名作为 release 名,一致
          name: v${{ steps.version.outputs.VERSION }}
          # 优先使用本地 draft_notes,缺失时由 GitHub 自动生成
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}  # 含 - 视为预发布
          files: |
            dist/apple-books-exporter-aarch64-apple-darwin
            dist/apple-books-exporter-x86_64-apple-darwin
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          # 如果 release 已存在(例如手动创建过),覆盖其资产
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release
        if: success()
        run: |
          echo "✅ Release v${{ steps.version.outputs.VERSION }} published"
          gh release view "v${{ steps.version.outputs.VERSION }}" --json name,assets,url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}