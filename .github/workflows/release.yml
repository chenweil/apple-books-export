name: Release

# 触发条件: 推送 v 开头的 tag (例如 v0.3.3, v1.0.0)
on:
  push:
    tags:
      - 'v*'

# 防止重复 release 跑挂
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write  # 创建 release 需要写权限

jobs:
  # ─────────────────────────────────────────────────
  # 1. 构建矩阵: 两个 macOS 平台构建 CLI
  #    (Linux 已移除 — Apple Books 仅存在于 macOS)
  # ─────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    # A leg whose runner label no longer exists is not rejected by Actions --
    # it is accepted and then sits queued with no runner assigned, forever,
    # and because the release job declares `needs: build` that stall is a
    # silent total outage. The job timeout turns that hang into a red run
    # that somebody can see. It is a backstop, not a fix: the label itself
    # still has to be a live one.
    timeout-minutes: 45
    strategy:
      fail-fast: false  # 一个平台失败不影响其他平台
      matrix:
        include:
          # macOS Apple Silicon (M1/M2/M3)
          - target: aarch64-apple-darwin
            os: macos-14
            label: macos-arm64
            binary_name: apple-books-exporter-aarch64-apple-darwin
          # macOS Intel
          # macos-13 was retired. A job requesting it is not rejected, it is
          # accepted and then sits in the queue with no runner assigned; a
          # rehearsal tag on 2026-09-30 queued this leg for 80 minutes on that
          # label alone. macos-15-intel is the current Intel label.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            label: macos-x86_64
            binary_name: apple-books-exporter-x86_64-apple-darwin

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # tests/headless_mainline.sh verifies the documented Tauri GUI rollback
          # tag resolves and is still an ancestor, which needs real history.
          fetch-depth: 0

      - name: Validate headless mainline
        run: bash tests/headless_mainline.sh

      # The tag used to only name the GitHub Release, so a mismatch between it
      # and Cargo.toml shipped a release page reading 0.4.0 around a binary
      # whose --version reported 0.3.3, with nothing failing. This runs before
      # any build so a mistyped tag costs seconds rather than a full build.
      # The check lives in a script so the workflow and the local guard share
      # one implementation and cannot drift.
      - name: Verify the tag matches Cargo.toml
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bash scripts/check-release-tag.sh "$TAG"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # ── CLI 构建准备 ──────────────────────────────
      - name: Install Rust toolchain (CLI)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Cache cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Run Rust tests
        run: cargo test --all-targets --locked

      - name: Validate bundled Skill binary
        run: |
          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              BINARY="skills/apple-books-export-rust/scripts/apple-books-exporter-aarch64-apple-darwin"
              ;;
            x86_64-apple-darwin)
              BINARY="skills/apple-books-export-rust/scripts/apple-books-exporter-x86_64-apple-darwin"
              ;;
            *)
              echo "unsupported release target: ${{ matrix.target }}" >&2
              exit 1
              ;;
          esac
          APPLE_BOOKS_EXPORTER_BIN="$BINARY" \
            skills/apple-books-export-rust/scripts/validate.sh --print-path

      # ── CLI 构建 ──────────────────────────────────
      - name: Build CLI release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Locate CLI binary
        id: locate-cli
        run: |
          CLI="target/${{ matrix.target }}/release/apple-books-exporter"
          OUTPUT="${{ matrix.binary_name }}"
          if [ ! -f "$CLI" ]; then
            echo "❌ CLI binary not found: $CLI"
            exit 1
          fi
          cp "$CLI" "$OUTPUT"
          echo "binary_path=$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "✅ Built: $OUTPUT ($(du -h "$OUTPUT" | cut -f1))"

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.binary_name }}
          path: ${{ steps.locate-cli.outputs.binary_path }}
          if-no-files-found: error
          retention-days: 7

      # ── AppKit 打包 (arm64) ─────────────────────────
      # AppKit is the shipped GUI, so a release that only carries the CLI hands
      # users nothing to install. Only the arm64 leg builds it: `swift build`
      # emits a host-architecture binary unless a --triple is given, and the
      # Intel leg is covered by #45, which is also where actually running the
      # x86_64 artifact belongs.
      - name: Build the AppKit DMG (arm64)
        if: matrix.label == 'macos-arm64'
        env:
          APP_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          swift build -c release --package-path appkit
          # CFBundleVersion is the bundle build number, not the marketing
          # version; it has to rise for each build of the same version, so it
          # is derived from the run rather than hand-maintained in three files.
          BUILD_VERSION="${{ github.run_number }}"
          # Absolute path: package-dmg.sh cd's into appkit/ before reading
          # RUST_CLI_BIN, so a workspace-relative path would not resolve.
          RUST_CLI_BIN="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/apple-books-exporter" \
          APP_VERSION="$APP_VERSION" \
          BUILD_VERSION="$BUILD_VERSION" \
            ./appkit/Scripts/package-dmg.sh

      # Trusting the packaging script's exit code is not enough: the whole point
      # of the version unification is that the shipped bundle agrees with the
      # tag, so read it back out of the mounted image.
      - name: Verify the shipped bundle matches the tag
        if: matrix.label == 'macos-arm64'
        env:
          APP_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -euo pipefail
          DMG="dist/Books-Exporter-${APP_VERSION}-unsigned.dmg"
          if [ ! -f "$DMG" ]; then
            echo "::error::expected DMG was not produced: $DMG"
            ls -la dist/ 2>/dev/null || true
            exit 1
          fi
          # The update manifest is a sibling release asset, not content of
          # the image: package-dmg.sh writes the DMG first and only then
          # emits latest.json into dist/. The app reads it to decide whether a
          # newer version exists, so two things about it matter: it has to name
          # this tag, and its channel has to be the one the tag implies.
          #
          # The channel used to be a literal "stable", so a prerelease
          # published a manifest claiming to be stable. That was wrong, but it
          # was not a live update-safety hole -- UpdateChecker independently
          # refuses any manifest whose version is a prerelease, so prereleases
          # were never offered to stable users either way. Asserting against
          # the produced file, rather than the script's text, is what makes
          # this a behavioural check: the bytes read here are the bytes that
          # get uploaded and eventually downloaded.
          MANIFEST="dist/latest.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "::error::the update manifest was not produced: $MANIFEST"
            exit 1
          fi
          manifest_channel="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["channel"])' "$MANIFEST")"
          manifest_version="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "$MANIFEST")"
          echo "manifest version=$manifest_version channel=$manifest_channel"
          if [ "$manifest_version" != "$APP_VERSION" ]; then
            echo "::error::the manifest names $manifest_version, not the tag $APP_VERSION"
            exit 1
          fi
          # The same implementation the packaging step ran, so the expected
          # value is derived from the version by one rule rather than two.
          # python3 is used above to read the JSON; it is present on the macOS
          # runner images, and this step has now run green there against a real
          # prerelease tag (run 36656323693).
          expected_channel="$(bash appkit/Scripts/release-channel.sh "$APP_VERSION")"
          if [ "$manifest_channel" != "$expected_channel" ]; then
            echo "::error::a $APP_VERSION build must ship on the $expected_channel channel, not $manifest_channel"
            exit 1
          fi
          MOUNT_DIR="$(mktemp -d)"
          hdiutil attach "$DMG" -mountpoint "$MOUNT_DIR" -nobrowse -quiet
          trap 'hdiutil detach "$MOUNT_DIR" -quiet' EXIT
          PLIST="$MOUNT_DIR/Books Exporter.app/Contents/Info.plist"
          bundle_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          bundle_build="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          echo "bundle version=$bundle_version build=$bundle_build (tag v$APP_VERSION)"
          if [ "$bundle_version" != "$APP_VERSION" ]; then
            echo "::error::the shipped bundle version does not match the tag"
            exit 1
          fi
          if [ -z "$bundle_build" ]; then
            echo "::error::the bundle carries no CFBundleVersion"
            exit 1
          fi
          # `file` alone only prints the architecture, so a wrong-arch binary
          # inside the bundle would ship green. This leg is the arm64 one, so
          # both executables have to be arm64.
          for binary in \
            "$MOUNT_DIR/Books Exporter.app/Contents/MacOS/BooksExporter" \
            "$MOUNT_DIR/Books Exporter.app/Contents/Resources/apple-books-exporter"; do
            if [ ! -f "$binary" ]; then
              echo "::error::missing from the bundle: $binary"
              exit 1
            fi
            file "$binary"
            if ! file "$binary" | grep -q 'arm64'; then
              echo "::error::expected an arm64 binary in the arm64 bundle: $binary"
              exit 1
            fi
          done

      - name: Upload AppKit artifact
        if: matrix.label == 'macos-arm64'
        uses: actions/upload-artifact@v4
        with:
          name: appkit-aarch64-${{ steps.tag.outputs.version }}
          # ADR 0004 requires a stable Release to carry both the DMG and a valid
          # latest.json; the manifest is what the app's update check reads, so
          # shipping the DMG alone would leave version discovery permanently
          # unresolved.
          path: |
            dist/Books-Exporter-*.dmg
            dist/latest.json
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────
  # 2. 收集所有 artifact, 创建/更新 GitHub Release
  # ─────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # tests/headless_mainline.sh verifies the documented Tauri GUI rollback
          # tag resolves and is still an ancestor, which needs real history.
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== 全部产物 ==="
          find dist -maxdepth 4 -type f -o -type d | head -50

      - name: Generate SHA256 checksums (files only)
        working-directory: dist
        run: |
          # Everything a user downloads is checksummed, including the AppKit DMG
          # and the update manifest.
          find . -maxdepth 2 -type f \
            \( -name "apple-books-exporter-*" -o -name "Books-Exporter-*.dmg" \
               -o -name "latest.json" \) \
            -exec sha256sum {} \; | tee SHA256SUMS
          echo ""
          echo "=== 文件清单 ==="
          find . -maxdepth 2 -type f | sort

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # Decided by the shared script rather than an inline `contains(...,'-')`,
      # so the Release's prerelease flag and the shipped manifest cannot
      # disagree about whether a version is a prerelease.
      - name: Classify the version
        id: channel
        run: |
          set -euo pipefail
          channel="$(bash appkit/Scripts/release-channel.sh "${{ steps.version.outputs.VERSION }}")"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          if [ "$channel" = "prerelease" ]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          # 含 prerelease 视为预发布；与打包脚本共用同一套 channel 规则
          prerelease: ${{ steps.channel.outputs.is_prerelease == 'true' }}
          # The AppKit artifacts are globbed rather than named: only the arm64
          # matrix leg produces them, so listing them literally would trip
          # fail_on_unmatched_files.
          files: |
            dist/apple-books-exporter-aarch64-apple-darwin
            dist/apple-books-exporter-x86_64-apple-darwin
            dist/Books-Exporter-*.dmg
            dist/latest.json
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release
        if: success()
        run: |
          echo "✅ Release v${{ steps.version.outputs.VERSION }} published"
          gh release view "v${{ steps.version.outputs.VERSION }}" --json name,assets,url
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
