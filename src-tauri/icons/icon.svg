<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8be9fd"/>
      <stop offset="100%" style="stop-color:#50fa7b"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Open book -->
  <g transform="translate(256, 220)">
    <!-- Left page -->
    <path d="M-8,-80 Q-8,-90 -20,-90 L-120,-90 Q-130,-90 -130,-80 L-130,80 Q-130,90 -120,90 L-20,90 Q-8,90 -8,80 Z"
          fill="#2a2a4a" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Right page -->
    <path d="M8,-80 Q8,-90 20,-90 L120,-90 Q130,-90 130,-80 L130,80 Q130,90 120,90 L20,90 Q8,90 8,80 Z"
          fill="#2a2a4a" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round"/>
    <!-- Spine -->
    <line x1="0" y1="-85" x2="0" y2="85" stroke="url(#accent)" stroke-width="3"/>

    <!-- Text lines - left page -->
    <rect x="-110" y="-60" width="80" height="4" rx="2" fill="#6272a4" opacity="0.7"/>
    <rect x="-110" y="-40" width="90" height="4" rx="2" fill="#6272a4" opacity="0.5"/>
    <rect x="-110" y="-20" width="70" height="4" rx="2" fill="#6272a4" opacity="0.7"/>
    <rect x="-110" y="0" width="85" height="4" rx="2" fill="#6272a4" opacity="0.5"/>
    <rect x="-110" y="20" width="60" height="4" rx="2" fill="#6272a4" opacity="0.7"/>

    <!-- Highlight on right page -->
    <rect x="15" y="-60" width="95" height="20" rx="4" fill="#8be9fd" opacity="0.2"/>
    <rect x="15" y="-56" width="95" height="3" rx="1.5" fill="#8be9fd" opacity="0.6"/>

    <!-- Text lines - right page -->
    <rect x="15" y="-25" width="80" height="4" rx="2" fill="#6272a4" opacity="0.5"/>
    <rect x="15" y="-5" width="90" height="4" rx="2" fill="#6272a4" opacity="0.7"/>
    <rect x="15" y="15" width="65" height="4" rx="2" fill="#6272a4" opacity="0.5"/>
    <rect x="15" y="35" width="80" height="4" rx="2" fill="#6272a4" opacity="0.7"/>
  </g>

  <!-- Export arrow -->
  <g transform="translate(370, 370)">
    <circle cx="0" cy="0" r="48" fill="url(#accent)" opacity="0.15"/>
    <path d="M0,-24 L16,-8 L8,-8 L8,16 L-8,16 L-8,-8 L-16,-8 Z"
          fill="url(#accent)" transform="rotate(0)"/>
    <rect x="-4" y="-8" width="8" height="4" rx="2" fill="url(#accent)" opacity="0"/>
    <!-- Arrow pointing down-right (export) -->
    <path d="M-10,-18 L0,-8 L-6,-8 L-6,14 L-14,14 L-14,-8 L-20,-8 Z"
          fill="url(#accent)" transform="rotate(-45)"/>
  </g>
</svg>
